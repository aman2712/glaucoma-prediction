# X2 variant: the P01 image-only recipe on a window around the predicted optic disc.
run_name: x2_crop
model_name: resnet18
pretrained: true
seed: 2440                  # overridden per run
batch_size: 16
epochs: 25
warmup_epochs: 2
patience: 6
head_lr: 0.0001
backbone_lr: 0.00001
weight_decay: 0.0001
augment: true
target_sensitivity: 0.9
n_bootstrap: 1000
crop_boxes: runs/x2/crop_boxes.csv    # boxes of 3 x the disc's longer side (measurements/disc_boxes.py)
